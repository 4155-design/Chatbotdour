<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOUR AI</title>
<style>
:root{color-scheme:dark;--bg:#0c0b10;--panel:#17141f;--line:#30283d;--purple:#9565e8;--text:#f5f1fc;--muted:#aaa1b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#33204f 0,transparent 42%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px;background:#100e16cc;position:sticky;top:0}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#b18aff,#6940b4);display:grid;place-items:center;font-weight:900;color:white}.brand{font-weight:800;letter-spacing:1.5px}.tag{color:var(--muted);font-size:12px}
main{max-width:900px;margin:auto;padding:34px 18px 130px}.welcome{text-align:center;padding:48px 10px 30px}.welcome h1{font-size:clamp(32px,7vw,54px);margin:0 0 10px}.welcome h1 span{color:#b58cff}.welcome p{color:var(--muted);margin:0}
#chat{display:flex;flex-direction:column;gap:16px}.msg{max-width:88%;padding:15px 17px;border:1px solid var(--line);border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#38265a;border-color:#65469a}.assistant{align-self:flex-start;background:var(--panel)}.label{font-size:11px;color:#c5a9ff;margin-bottom:6px;font-weight:700;letter-spacing:.6px}
.composer{position:fixed;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,#0c0b10 20%);}.composer-inner{max-width:900px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;gap:10px;align-items:flex-end;box-shadow:0 10px 45px #0008}
textarea{flex:1;resize:none;min-height:48px;max-height:180px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:12px}button{border:0;border-radius:14px;background:var(--purple);color:white;font-weight:700;padding:13px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}.error{color:#ffaaaa}
@media(max-width:550px){main{padding-top:12px}.welcome{padding:35px 4px 24px}.msg{max-width:95%}.composer{padding:10px}.composer-inner{border-radius:16px}button{padding:12px}}
</style></head>
<body>
<header><div class="logo">D</div><div style="flex:1"><div class="brand">DOUR AI</div><div class="tag">Dein KI-Assistent</div></div><button id="clear" type="button" style="background:#30283d;padding:10px 13px">Neuer Chat</button></header>
<main><section class="welcome" id="welcome"><h1>Was kann ich für <span>dich</span> tun?</h1><p>Frage etwas, lass dir Code schreiben oder entwickle neue Ideen.</p></section><section id="chat" aria-live="polite"></section></main>
<div class="composer"><div class="composer-inner"><select id="mode" aria-label="Chat-Modus" style="background:#211d2b;color:#f5f1fc;border:1px solid #30283d;border-radius:12px;padding:10px;max-width:112px"><option value="normal">Normal</option><option value="code">Coding</option></select><textarea id="prompt" placeholder="Schreibe eine Nachricht an DOUR AI…" rows="1"></textarea><button id="send">Senden</button></div><div class="hint">DOUR AI kann Fehler machen. Prüfe wichtige Informationen.</div></div>
<script>
const API_URL = "https://dour-ai-api-4155.onrender.com/api/chat";
const promptBox=document.getElementById("prompt"),sendBtn=document.getElementById("send"),chat=document.getElementById("chat");
let history=[];
const STORAGE_KEY="dour-ai-chat-v1";
function saveHistory(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(history.slice(-40)))}catch(e){}}
function addMessage(role,text){document.getElementById("welcome").style.display="none";const el=document.createElement("div");el.className="msg "+role;const label=document.createElement("div");label.className="label";label.textContent=role==="user"?"DU":"DOUR AI";const body=document.createElement("div");body.textContent=text;el.append(label,body);chat.append(el);el.scrollIntoView({behavior:"smooth",block:"end"});return body}
function restoreHistory(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(Array.isArray(saved)){
   history=saved.filter(m=>m&&["user","assistant"].includes(m.role)&&typeof m.content==="string").slice(-40);
   history.forEach(m=>addMessage(m.role,m.content));
  }
 }catch(e){history=[]}
}
restoreHistory();
document.getElementById("clear").addEventListener("click",()=>{
 if(!confirm("Möchtest du diesen Chat wirklich löschen?"))return;
 history=[];localStorage.removeItem(STORAGE_KEY);chat.replaceChildren();document.getElementById("welcome").style.display="";
});
async function send(){const text=promptBox.value.trim();if(!text||sendBtn.disabled)return;promptBox.value="";addMessage("user",text);history.push({role:"user",content:text});saveHistory();const answer=addMessage("assistant","DOUR AI denkt nach …");sendBtn.disabled=true;
try{const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,mode:document.getElementById("mode").value})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Serverfehler");const reply=data.reply||"Ich konnte keine Antwort erzeugen.";answer.textContent=reply;history.push({role:"assistant",content:reply});saveHistory()}catch(e){answer.textContent="Verbindungsfehler: "+e.message;answer.classList.add("error")}finally{sendBtn.disabled=false;promptBox.focus()}}
sendBtn.addEventListener("click",send);promptBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});promptBox.addEventListener("input",()=>{promptBox.style.height="auto";promptBox.style.height=Math.min(promptBox.scrollHeight,180)+"px"});
</script></body></html>
